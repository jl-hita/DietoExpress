<ng-container *ngIf="!resetToken; else resetPasswordForm">
  <form [formGroup]="requestForm" (ngSubmit)="requestReset()" class="login-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="email" required />
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="loading || requestForm.invalid">
      {{ loading ? 'Enviando email...' : 'Enviar enlace de recuperación' }}
    </button>
  </form>
</ng-container>

<ng-template #resetPasswordForm>
  <form [formGroup]="resetForm" (ngSubmit)="resetPassword()" class="login-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nueva contraseña</mat-label>
      <input matInput type="password" formControlName="newPassword" autocomplete="new-password" required />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Repite la nueva contraseña</mat-label>
      <input matInput type="password" formControlName="newPasswordRep" autocomplete="new-password" required />
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" [disabled]="loading || resetForm.invalid">
      {{ loading ? 'Guardando...' : 'Cambiar contraseña' }}
    </button>
  </form>
</ng-template>
