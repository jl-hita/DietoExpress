<div class="sidebar-container">
  <div class="profile">
    <img [src]="profileImage" (error)="onProfileImageError()" alt="Imagen de perfil" class="avatar" />
    <div class="name">{{ userName }}</div>
  </div>

  <mat-nav-list>
    <div class="menu-item" *ngIf="isProfessionalAccount || isFreeAccount">
      <a mat-list-item routerLink="/clients" routerLinkActive="active-link">
        <mat-icon>group</mat-icon>
        <span>Clientes</span>
      </a>
    </div>

    <div class="menu-item" *ngIf="isProfessionalAccount">
      <a mat-list-item routerLink="/diets" routerLinkActive="active-link">
        <mat-icon>restaurant</mat-icon>
        <span>Dietas</span>
      </a>
    </div>

    <div class="menu-item">
      <a mat-list-item routerLink="/billing" routerLinkActive="active-link">
        <mat-icon>workspace_premium</mat-icon>
        <span>Suscripción</span>
      </a>
    </div>

    <div class="menu-item">
      <a mat-list-item routerLink="/settings" routerLinkActive="active-link">
        <mat-icon>settings</mat-icon>
        <span>Ajustes</span>
      </a>
    </div>

    <div class="menu-item superadmin-item" *ngIf="isClinic">
      <a mat-list-item routerLink="/clinic" routerLinkActive="active-link">
        <mat-icon>business</mat-icon>
        <span>Panel de clínica</span>
      </a>
    </div>

    <!-- Acceso SuperAdmin exclusivo -->
    <div class="menu-item superadmin-item" *ngIf="isSuperAdmin">
      <a mat-list-item routerLink="/admin" routerLinkActive="active-link">
        <mat-icon>admin_panel_settings</mat-icon>
        <span>Panel SuperAdmin</span>
      </a>
    </div>

    <div class="menu-item superadmin-item" *ngIf="isSuperAdmin">
      <a mat-list-item routerLink="/admin/logs" routerLinkActive="active-link">
        <mat-icon>description</mat-icon>
        <span>Logs del sistema</span>
      </a>
    </div>

    <div class="menu-item superadmin-item" *ngIf="isSuperAdmin">
      <a mat-list-item routerLink="/admin/plans" routerLinkActive="active-link">
        <mat-icon>sell</mat-icon>
        <span>Planes SaaS</span>
      </a>
    </div>

    <!-- Enlace de logout -->
    <div class="menu-item logout-link">
      <a mat-list-item (click)="logout()" style="cursor: pointer;">
        <mat-icon>logout</mat-icon>
        <span>Cerrar Sesión</span>
      </a>
    </div>
  </mat-nav-list>
</div>
