<section class="notification-panel" *ngIf="open">
  <div class="notification-panel-header">
    <div>
      <strong>{{ 'patient.notifications.title' | t }}</strong>
      <span *ngIf="unreadCount">{{ 'patient.notifications.unread' | t: { count: unreadCount } }}</span>
    </div>
    <button type="button" (click)="enablePush.emit()" [disabled]="pushBusy || !pushSupported || pushEnabled" class="notification-push-btn">
      <mat-icon>{{ pushEnabled ? 'notifications_active' : 'notifications_none' }}</mat-icon>
      {{ (pushEnabled ? 'patient.notifications.pushEnabled' : pushBusy ? 'patient.notifications.pushEnabling' : 'patient.notifications.enablePush') | t }}
    </button>
  </div>
  <div class="notification-push-message" *ngIf="pushMessage">{{ pushMessage }}</div>
  <div class="notification-list" *ngIf="!loading && notifications.length">
    <button type="button" class="notification-item" *ngFor="let notification of notifications"
            [class.unread]="!notification.readAt" (click)="markRead.emit(notification)">
      <span class="notification-icon"><mat-icon>{{ notificationIcon(notification.type) }}</mat-icon></span>
      <span class="notification-copy">
        <strong>{{ notification.title }}</strong>
        <span>{{ notification.message }}</span>
        <small>{{ notification.createdAt | date:'d MMM, HH:mm' }}</small>
      </span>
    </button>
  </div>
  <div class="notification-empty" *ngIf="!loading && !notifications.length">
    <mat-icon>notifications_none</mat-icon>
    <span>{{ 'patient.notifications.empty' | t }}</span>
  </div>
  <div class="notification-loading" *ngIf="loading">
    <mat-spinner diameter="22"></mat-spinner>
  </div>
</section>
