<mat-card class="receta-card">
  <h2>Crear nueva receta</h2>

  <form [formGroup]="formReceta" (ngSubmit)="guardarReceta()">
    <div class="form-grid">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Nombre</mat-label>
        <input matInput formControlName="nombre" required>
        <mat-error *ngIf="formReceta.controls['nombre'].hasError('required')">
          El nombre es obligatorio
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Descripción</mat-label>
        <textarea matInput formControlName="descripcion" rows="5"></textarea>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Instrucciones</mat-label>
        <textarea matInput formControlName="receta" rows="14" required></textarea>
        <mat-error *ngIf="formReceta.controls['receta'].hasError('required')">
          Las instrucciones son obligatorias
        </mat-error>
      </mat-form-field>
    </div>

    <h3>Ingredientes</h3>
    <div formArrayName="ingredientes" class="ingredientes-lista">
      <div *ngFor="let ing of ingredientes.controls; let i = index" [formGroupName]="i" class="ingrediente-item">
        <mat-form-field appearance="outline">
          <mat-label>Nombre</mat-label>
          <input matInput formControlName="nombre">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Cantidad</mat-label>
          <input matInput type="number" formControlName="cantidad">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Unidad</mat-label>
          <mat-select formControlName="unidad">
            <mat-option *ngFor="let u of unidades" [value]="u.value">
              {{u.label}}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="desc-field">
          <mat-label>Descripción</mat-label>
          <input matInput formControlName="descripcion">
        </mat-form-field>

        <button mat-icon-button color="warn" type="button" (click)="eliminarIngrediente(i)">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </div>

    <button mat-stroked-button type="button" color="primary" (click)="agregarIngrediente()">
      <mat-icon>add</mat-icon> Añadir ingrediente
    </button>

    <div class="acciones">
      <button mat-flat-button color="accent" type="submit" [disabled]="formReceta.invalid || cargando">
        Guardar receta
      </button>
    </div>
  </form>

  <mat-progress-bar *ngIf="cargando" mode="indeterminate"></mat-progress-bar>
  <p *ngIf="mensaje" class="mensaje">{{ mensaje }}</p>
</mat-card>
