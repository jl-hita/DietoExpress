version: 2
updates:
  - package-ecosystem: npm
    directory: "/anguloso.client"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
    labels:
      - dependencies
      - frontend

  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
    labels:
      - dependencies
      - backend

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
