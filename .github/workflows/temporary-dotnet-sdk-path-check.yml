name: Temporary self-hosted .NET SDK path check

on:
  push:
    branches:
      - fix/self-hosted-dotnet-sdk-path

jobs:
  verify-sdk-install:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup .NET in writable directory
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
        with:
          dotnet-version: 10.x
      - name: Verify SDK
        shell: bash
        run: |
          set -euo pipefail
          command -v dotnet
          dotnet --list-sdks
          dotnet --version | grep -E '^10\.'
