name: Deploy DietoExpress

on:
  push:
    branches:
      - main

# Solo un despliegue de producción a la vez.
# Si llegan varios commits mientras se espera, se conserva el más reciente.
concurrency:
  group: dietoexpress-production
  # Nunca interrumpir un despliegue que ya está modificando producción.
  # GitHub conserva la ejecución activa y sustituye la pendiente por la más reciente.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify production .NET runtime before deployment
        run: |
          set -euo pipefail
          if ! /usr/bin/dotnet --list-runtimes | grep -E '^Microsoft\\.AspNetCore\\.App 10\\.'; then
            echo "ERROR: /usr/bin/dotnet no tiene instalado Microsoft.AspNetCore.App 10.x. Instala el runtime de ASP.NET Core 10 en weirdfish antes de fusionar/desplegar esta migración. No se ha modificado producción."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        env:
          # El runner self-hosted no puede escribir en /usr/share/dotnet.
          # Instalamos el SDK en el directorio temporal escribible del runner.
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
        with:
          # Keep deploy aligned with PR validation; avoid the unavailable floating SDK/runtime downloads.
          dotnet-version: 10.0.401

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3

      - name: Preparar Angular
        working-directory: anguloso.client
        run: |
          mkdir -p obj/Debug
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Restaurar .NET
        run: |
          dotnet restore Anguloso.Server/Anguloso.Server.csproj
          dotnet restore Tests/DietoExpress.Security.Tests/DietoExpress.Security.Tests.csproj

      - name: Auditar dependencias .NET
        run: |
          set -o pipefail
          audit_output="$(dotnet list Anguloso.Server/Anguloso.Server.csproj package --vulnerable --include-transitive)"
          printf '%s\n' "$audit_output"
          if printf '%s\n' "$audit_output" | grep -Eiq '>.*(High|Critical)'; then
            echo "Se han detectado vulnerabilidades High/Critical en dependencias .NET."
            exit 1
          fi

      - name: Auditar dependencias del proyecto de tests
        run: |
          set -o pipefail
          audit_output="$(dotnet list Tests/DietoExpress.Security.Tests/DietoExpress.Security.Tests.csproj package --vulnerable --include-transitive)"
          printf '%s\n' "$audit_output"
          if printf '%s\n' "$audit_output" | grep -Eiq '>.*(High|Critical)'; then
            echo "Se han detectado vulnerabilidades High/Critical en dependencias del proyecto de tests."
            exit 1
          fi

      - name: Compilar .NET
        run: dotnet build Anguloso.Server/Anguloso.Server.csproj -c Release --no-restore

      - name: Ejecutar pruebas de seguridad
        run: dotnet test Tests/DietoExpress.Security.Tests/DietoExpress.Security.Tests.csproj -c Release --no-restore

      - name: Publicar .NET
        run: |
          rm -rf /tmp/dietoexpress-publish
          dotnet publish Anguloso.Server/Anguloso.Server.csproj \
            -c Release \
            --no-restore \
            --no-build \
            -o /tmp/dietoexpress-publish

      - name: Preparar versión de backend
        run: |
          rm -rf /tmp/dietoexpress-backend
          mkdir -p /tmp/dietoexpress-backend
          cp -a /tmp/dietoexpress-publish/. /tmp/dietoexpress-backend/

      - name: Preparar versión de frontend
        run: |
          rm -rf /tmp/dietoexpress-frontend
          mkdir -p /tmp/dietoexpress-frontend
          # @angular/build:application writes browser assets under the browser/ subdirectory.
          test -f anguloso.client/dist/anguloso.client/browser/index.html
          cp -a anguloso.client/dist/anguloso.client/browser/. /tmp/dietoexpress-frontend/
          test -f /tmp/dietoexpress-frontend/index.html

      - name: Desplegar versión atómica y comprobar servicio
        env:
          DIETOEXPRESS_VERSION: ${{ github.sha }}
          DIETOEXPRESS_BACKEND_STAGE: /tmp/dietoexpress-backend
          DIETOEXPRESS_FRONTEND_STAGE: /tmp/dietoexpress-frontend
          DIETOEXPRESS_DOMAIN: jlhitap.duckdns.org
          DIETOEXPRESS_KEEP_RELEASES: 5
        run: bash scripts/dietoexpress-deploy-atomic.sh
