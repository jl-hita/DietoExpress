name: Deploy DietoExpress

on:
  push:
    branches:
      - main

# Solo un despliegue de producción a la vez.
# Si llegan varios commits mientras se espera, se conserva el más reciente.
concurrency:
  group: dietoexpress-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Angular
        working-directory: anguloso.client
        run: |
          mkdir -p obj/Debug
          npm install
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: Restaurar .NET
        run: |
          dotnet restore Anguloso.Server/Anguloso.Server.csproj
          dotnet restore Tests/DietoExpress.Security.Tests/DietoExpress.Security.Tests.csproj

      - name: Auditar dependencias .NET
        run: dotnet list Anguloso.Server/Anguloso.Server.csproj package --vulnerable --include-transitive

      - name: Compilar .NET
        run: dotnet build Anguloso.Server/Anguloso.Server.csproj -c Release --no-restore

      - name: Ejecutar pruebas de seguridad
        run: dotnet test Tests/DietoExpress.Security.Tests/DietoExpress.Security.Tests.csproj -c Release --no-restore

      - name: Publicar .NET
        run: |
          rm -rf /tmp/dietoexpress-publish
          dotnet publish Anguloso.Server/Anguloso.Server.csproj             -c Release             --no-restore             --no-build             -o /tmp/dietoexpress-publish

      # Preparamos todo antes de tocar la versión actualmente desplegada.
      - name: Preparar versión de backend
        run: |
          rm -rf /tmp/dietoexpress-backend
          mkdir -p /tmp/dietoexpress-backend
          cp -a /tmp/dietoexpress-publish/. /tmp/dietoexpress-backend/

      - name: Preparar versión de frontend
        run: |
          rm -rf /tmp/dietoexpress-frontend
          mkdir -p /tmp/dietoexpress-frontend
          cp -a anguloso.client/dist/anguloso.client/. /tmp/dietoexpress-frontend/

      # El cambio de versión se hace al final, después de que build y publish
      # hayan terminado correctamente.
      - name: Desplegar backend
        run: |
          rm -rf /opt/dietoexpress/*
          cp -a /tmp/dietoexpress-backend/. /opt/dietoexpress/
          mkdir -p /opt/dietoexpress/wwwroot
          cp -a /tmp/dietoexpress-frontend/. /opt/dietoexpress/wwwroot/

      - name: Desplegar frontend
        run: |
          rm -rf /var/www/dietoexpress/*
          cp -a /tmp/dietoexpress-frontend/. /var/www/dietoexpress/

      - name: Reiniciar DietoExpress
        run: |
          sudo systemctl enable dietoexpress.service
          sudo systemctl restart dietoexpress.service
