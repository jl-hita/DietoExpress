name: Temporary live generator evaluation

on:
  push:
    branches:
      - audit/repdb-catalog-export-20261107

jobs:
  evaluate-live-catalog:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.401
      - name: Exportar catálogo desplegado
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 5 --max-time 120 \
            -H "Accept: application/json" \
            "http://127.0.0.1:5000/api/exercise-catalog/audit-export" \
            -o "$GITHUB_WORKSPACE/repdb-catalog-audit.json"
          python3 - <<'PY'
          import json, os
          p = os.path.join(os.environ["GITHUB_WORKSPACE"], "repdb-catalog-audit.json")
          d = json.load(open(p, encoding="utf-8"))
          assert d.get("complete") is True and d.get("returned") == len(d.get("items", []))
          assert d.get("totalRecords") == len(d["items"])
          print("Catálogo vivo: %d filas; %s" % (len(d["items"]), d.get("countsByStatus", {})))
          PY
      - name: Preparar evaluador C# temporal
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/LiveCatalogAudit"
          cat > "$RUNNER_TEMP/LiveCatalogAudit/LiveCatalogAudit.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net10.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
            <ItemGroup>
              <ProjectReference Include="$GITHUB_WORKSPACE/Anguloso.Server/Anguloso.Server.csproj" />
            </ItemGroup>
          </Project>
          EOF
          sed -i "s|\$GITHUB_WORKSPACE|$GITHUB_WORKSPACE|g" "$RUNNER_TEMP/LiveCatalogAudit/LiveCatalogAudit.csproj"
          cat > "$RUNNER_TEMP/LiveCatalogAudit/Program.cs" <<'CS'
          using System.Text.Json;
          using Anguloso.Server.Logica;

          static string? Str(JsonElement e, string key) =>
              e.TryGetProperty(key, out var v) && v.ValueKind == JsonValueKind.String ? v.GetString() : null;
          static int Int(JsonElement e, string key, int fallback = 50) =>
              e.TryGetProperty(key, out var v) && v.TryGetInt32(out var n) ? n : fallback;
          static string[] Strings(JsonElement e, string key) =>
              e.TryGetProperty(key, out var v) && v.ValueKind == JsonValueKind.Array
                  ? v.EnumerateArray().Where(x => x.ValueKind == JsonValueKind.String).Select(x => x.GetString()!).ToArray()
                  : [];
          static T[] Enums<T>(JsonElement e, string key) where T : struct, Enum =>
              Strings(e, key).Select(x => Enum.TryParse<T>(x, true, out var parsed) ? (T?)parsed : null)
                  .Where(x => x.HasValue).Select(x => x!.Value).Distinct().ToArray();

          var input = args[0];
          var output = args[1];
          using var document = JsonDocument.Parse(File.ReadAllText(input));
          var items = document.RootElement.GetProperty("items").EnumerateArray().ToArray();
          var candidates = new List<TrainingExerciseCandidate>();
          var skipped = new List<object>();
          foreach (var item in items.Where(x => Str(x, "reviewStatus") == "approved"))
          {
              var id = Str(item, "id") ?? "";
              var patternText = Str(item, "movementPattern");
              var experienceText = Str(item, "minimumExperience");
              if (!Enum.TryParse<TrainingMovementPattern>(patternText, true, out var pattern) ||
                  !Enum.TryParse<TrainingExperience>(experienceText, true, out var experience))
              {
                  skipped.Add(new { id, reason = "movementPattern/minimumExperience no reconocido", patternText, experienceText });
                  continue;
              }
              var primary = Enums<TrainingMuscleGroup>(item, "reviewedPrimaryMuscles");
              var secondary = Enums<TrainingMuscleGroup>(item, "reviewedSecondaryMuscles");
              var goals = Enums<TrainingGoal>(item, "suitableGoals");
              if (primary.Length == 0 || goals.Length == 0)
              {
                  skipped.Add(new { id, reason = "sin grupos principales u objetivos válidos", primary = Strings(item, "reviewedPrimaryMuscles"), goals = Strings(item, "suitableGoals") });
                  continue;
              }
              var name = Str(item, "nameEs") ?? Str(item, "nameEn") ?? id;
              candidates.Add(new TrainingExerciseCandidate(id, "live-db-2026-11-07", name, pattern,
                  Strings(item, "requiredEquipment"), goals, experience, Int(item, "selectionPriority"),
                  true, primary, secondary));
          }

          var equipmentLevels = new (string Name, string[] Items)[]
          {
              ("full_gym", candidates.SelectMany(x => x.RequiredEquipment).Distinct(StringComparer.OrdinalIgnoreCase).ToArray()),
              ("home_dumbbell_kettlebell", ["dumbbell", "kettlebell", "bench", "resistance-band", "pull-up-bar", "ab-wheel"]),
              ("bodyweight_only", ["bodyweight"])
          };
          var dayOptions = new[]
          {
              new[] { DayOfWeek.Monday, DayOfWeek.Thursday },
              new[] { DayOfWeek.Monday, DayOfWeek.Wednesday, DayOfWeek.Friday },
              new[] { DayOfWeek.Monday, DayOfWeek.Tuesday, DayOfWeek.Thursday, DayOfWeek.Saturday }
          };
          var scenarios = new List<object>();
          foreach (var goal in Enum.GetValues<TrainingGoal>())
          foreach (var experience in Enum.GetValues<TrainingExperience>())
          foreach (var days in dayOptions)
          foreach (var budget in new[] { 35, 60, 90 })
          foreach (var equipment in equipmentLevels)
          {
              var id = $"{goal}-{experience}-{days.Length}d-{budget}m-{equipment.Name}";
              var request = new TrainingProgramGenerationRequest(goal, experience,
                  new DateOnly(2026, 11, 9), 4, days, budget, equipment.Items, []);
              var result = TrainingProgramGenerator.Generate(request, candidates);
              if (!result.Succeeded || result.Prescription is null)
              {
                  scenarios.Add(new { id, goal = goal.ToString(), experience = experience.ToString(), days = days.Length,
                      budget, equipment = equipment.Name, succeeded = false, errors = result.Errors });
                  continue;
              }

              var plan = result.Prescription;
              var sessions = plan.Sessions.Select(s => new
              {
                  week = s.WeekNumber, day = s.Day.ToString(), title = s.Title,
                  minutes = s.EstimatedDurationMinutes,
                  totalSets = s.Exercises.Sum(e => e.Sets),
                  exercises = s.Exercises.Select(e => new
                  {
                      id = e.ExerciseId, sets = e.Sets, minReps = e.MinRepetitions, maxReps = e.MaxRepetitions,
                      rir = e.TargetRepetitionsInReserve, progression = e.ProgressionRule.ToString(),
                      primary = e.PrimaryMuscleGroups.Select(x => x.ToString()).ToArray(),
                      secondary = e.SecondaryMuscleGroups.Select(x => x.ToString()).ToArray()
                  }).ToArray()
              }).ToArray();
              var primaryByWeek = Enumerable.Range(1, plan.DurationWeeks).Select(week =>
              {
                  var totals = new Dictionary<string, int>(StringComparer.Ordinal);
                  foreach (var session in plan.Sessions.Where(s => s.WeekNumber == week))
                  foreach (var exercise in session.Exercises)
                  foreach (var muscle in exercise.PrimaryMuscleGroups)
                      totals[muscle.ToString()] = totals.GetValueOrDefault(muscle.ToString()) + exercise.Sets;
                  return new { week, primarySets = totals };
              }).ToArray();
              var equipmentSet = new HashSet<string>(equipment.Items, StringComparer.OrdinalIgnoreCase);
              var candidateById = candidates.ToDictionary(x => x.ExerciseId, StringComparer.OrdinalIgnoreCase);
              var violations = plan.Sessions.SelectMany(s => s.Exercises.SelectMany(e =>
                  candidateById[e.ExerciseId].RequiredEquipment.Where(required => !equipmentSet.Contains(required))
                      .Select(required => new { week = s.WeekNumber, day = s.Day.ToString(), exerciseId = e.ExerciseId, required }))).ToArray();
              scenarios.Add(new
              {
                  id, goal = goal.ToString(), experience = experience.ToString(), days = days.Length,
                  budget, equipment = equipment.Name, succeeded = true,
                  maxMinutes = plan.Sessions.Max(s => s.EstimatedDurationMinutes),
                  minMinutes = plan.Sessions.Min(s => s.EstimatedDurationMinutes),
                  warnings = plan.QualityReport?.Warnings ?? [],
                  primaryByWeek, sessions, equipmentViolations = violations
              });
          }

          var report = new
          {
              catalog = new
              {
                  total = items.Length,
                  approved = items.Count(x => Str(x, "reviewStatus") == "approved"),
                  candidates = candidates.Count,
                  skippedApproved = skipped
              },
              scenarioCount = scenarios.Count,
              scenarios
          };
          File.WriteAllText(output, JsonSerializer.Serialize(report, new JsonSerializerOptions(JsonSerializerDefaults.Web)
          {
              WriteIndented = true
          }));
          Console.WriteLine($"Evaluados {scenarios.Count} escenarios con {candidates.Count} candidatos; omitidos {skipped.Count} aprobados.");
          CS
      - name: Ejecutar evaluación contra el catálogo vivo
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project "$RUNNER_TEMP/LiveCatalogAudit/LiveCatalogAudit.csproj" -c Release -- \
            "$GITHUB_WORKSPACE/repdb-catalog-audit.json" \
            "$GITHUB_WORKSPACE/live-generator-evaluation.json"
      - uses: actions/upload-artifact@v7
        with:
          name: live-generator-evaluation-20261107
          path: ${{ github.workspace }}/live-generator-evaluation.json
          if-no-files-found: error
          retention-days: 1
