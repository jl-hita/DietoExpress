name: Playwright E2E semanal

on:
  # GitHub Actions programa en UTC. Estas dos invocaciones cubren las 02:00
  # de Europe/Madrid en invierno y verano; el primer paso filtra la correcta.
  schedule:
    - cron: '0 0 * * 0'
    - cron: '0 1 * * 0'
  workflow_dispatch:
    inputs:
      rerun_visual_baseline:
        description: "Repetir la revisión visual/documental inicial tras cambios relevantes"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: dietoexpress-playwright-e2e
  cancel-in-progress: false

jobs:
  browser-tests:
    name: Batería E2E completa (semanal)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://jlhitap.duckdns.org' }}
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_SUPERADMIN_USERNAME: ${{ secrets.E2E_SUPERADMIN_USERNAME }}
      E2E_SUPERADMIN_PASSWORD: ${{ secrets.E2E_SUPERADMIN_PASSWORD }}

    steps:
      - name: Seleccionar ejecución de las 02:00 de Madrid
        id: schedule
        if: github.event_name == 'schedule'
        shell: bash
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          # Se usa la expresión que disparó el workflow, no la hora de inicio
          # del runner, porque GitHub puede retrasar una ejecución programada.
          local_offset="$(TZ=Europe/Madrid date +%z)"
          local_month="$(TZ=Europe/Madrid date +%m)"
          local_day="$(TZ=Europe/Madrid date +%d)"
          local_weekday="$(TZ=Europe/Madrid date +%u)" # 1=lunes, 7=domingo
          last_sunday_of_month=false
          if [[ "$local_day" -ge 25 && "$local_weekday" == "7" ]]; then
            last_sunday_of_month=true
          fi

          # Horario normal: 00:00 UTC equivale a 02:00 CEST; 01:00 UTC a 02:00 CET.
          # Cambio de primavera: 02:00 local no existe, así que se usa 03:00 local ese domingo.
          # Cambio de otoño: 02:00 ocurre dos veces; solo se ejecuta la primera (CEST).
          if [[ "$SCHEDULE_CRON" == "0 0 * * 0" && ( "$local_offset" == "+0200" || ( "$local_month" == "10" && "$last_sunday_of_month" == "true" ) ) ]] ||
             [[ "$SCHEDULE_CRON" == "0 1 * * 0" && "$local_offset" == "+0100" && ! ( "$local_month" == "10" && "$last_sunday_of_month" == "true" ) ]] ||
             [[ "$SCHEDULE_CRON" == "0 1 * * 0" && "$local_month" == "03" && "$last_sunday_of_month" == "true" ]]; then
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            if [[ "$local_month" == "03" && "$local_weekday" == "7" && "$local_day" -ge 25 && "$SCHEDULE_CRON" == "0 1 * * 0" ]]; then
              echo "Cambio horario de primavera: esta ejecución es la alternativa de las 03:00 locales."
            else
              echo "Esta invocación corresponde a la ejecución semanal de Europe/Madrid."
            fi
          else
            echo "run_e2e=false" >> "$GITHUB_OUTPUT"
            echo "Esta invocación UTC no es la elegida para la ejecución semanal de Europe/Madrid; se omite."
          fi

      - name: Detectar si sigue pendiente la revisión visual inicial
        id: baseline
        if: github.event_name != 'schedule' || steps.schedule.outputs.run_e2e == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BASELINE: ${{ inputs.rerun_visual_baseline }}
        run: |
          if [[ "$FORCE_BASELINE" == "true" ]]; then
            echo "run_visual_baseline=true" >> "$GITHUB_OUTPUT"
            echo "La revisión visual/documental se ha solicitado explícitamente."
            exit 0
          fi
          comments="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/4/comments?per_page=100")"
          if printf '%s' "$comments" | python3 -c 'import json,sys; data=json.load(sys.stdin); marker="<!-- E2E_VISUAL_BASELINE_PASSED -->"; sys.exit(0 if any(marker in (item.get("body") or "") for item in data) else 1)'; then
            echo "run_visual_baseline=false" >> "$GITHUB_OUTPUT"
            echo "La revisión visual/documental inicial ya pasó; no se repite."
          else
            echo "run_visual_baseline=true" >> "$GITHUB_OUTPUT"
            echo "Se ejecutará la revisión visual/documental inicial."
          fi

      - name: Checkout
        if: github.event_name != 'schedule' || steps.schedule.outputs.run_e2e == 'true'
        uses: actions/checkout@v7

      # El E2E navega por producción, no por una compilación local. Esperar al despliegue
      # del mismo SHA evita validar bundles/API de la versión anterior inmediatamente tras un merge.
      - name: Esperar al despliegue de este commit en producción
        if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 2400))
          while (( SECONDS < deadline )); do
            runs="$(gh run list --repo "$GH_REPO" --workflow deploy.yml --commit "$TARGET_SHA" --json databaseId,status,conclusion --limit 10)"
            run_id="$(printf '%s' "$runs" | jq -r '.[0].databaseId // empty')"
            status="$(printf '%s' "$runs" | jq -r '.[0].status // empty')"
            conclusion="$(printf '%s' "$runs" | jq -r '.[0].conclusion // empty')"
            if [[ -z "$run_id" ]]; then
              echo "Aún no aparece el despliegue para $TARGET_SHA; esperando a que GitHub lo registre."
            elif [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" == "success" ]]; then
                echo "El despliegue $run_id del commit $TARGET_SHA ha terminado correctamente."
                exit 0
              fi
              echo "::error::El despliegue $run_id terminó con conclusión '$conclusion'; no se ejecutará E2E contra una versión anterior."
              gh run view "$run_id" --repo "$GH_REPO" --log-failed || true
              exit 1
            else
              echo "Despliegue $run_id en estado '$status'; se comprobará de nuevo en 30 segundos."
            fi
            sleep 30
          done
          echo "::error::Tiempo de espera agotado esperando el despliegue de $TARGET_SHA."
          exit 1

      - name: Verificar credenciales E2E obligatorias
        if: github.event_name != 'schedule' || steps.schedule.outputs.run_e2e == 'true'
        shell: bash
        run: |
          missing=0
          for name in E2E_USERNAME E2E_PASSWORD E2E_SUPERADMIN_USERNAME E2E_SUPERADMIN_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Falta el secreto obligatorio $name; se aborta para evitar que flujos críticos queden como skipped."
              missing=1
            fi
          done
          exit "$missing"

      - name: Setup Node
        if: github.event_name != 'schedule' || steps.schedule.outputs.run_e2e == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3

      - name: Install Playwright test runner
        id: install
        if: github.event_name != 'schedule' || steps.schedule.outputs.run_e2e == 'true'
        working-directory: e2e
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install Chromium
        id: chromium
        if: github.event_name != 'schedule' || steps.schedule.outputs.run_e2e == 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run one-time visual/document baseline
        id: baseline_tests
        if: steps.baseline.outputs.run_visual_baseline == 'true' && (github.event_name != 'schedule' || steps.schedule.outputs.run_e2e == 'true')
        working-directory: e2e
        env:
          E2E_RUN_VISUAL_BASELINE: 'true'
        run: npx playwright test tests/visual-baseline.spec.mjs

      - name: Upload visual baseline evidence
        id: baseline_evidence
        if: always() && steps.baseline.outputs.run_visual_baseline == 'true' && (github.event_name != 'schedule' || steps.schedule.outputs.run_e2e == 'true')
        uses: actions/upload-artifact@v6
        with:
          name: playwright-visual-baseline-evidence
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Registrar revisión visual/documental completada
        if: steps.baseline_tests.outcome == 'success' && steps.baseline_evidence.outcome == 'success' && steps.baseline.outputs.run_visual_baseline == 'true' && (github.event_name != 'schedule' || steps.schedule.outputs.run_e2e == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: |
            <!-- E2E_VISUAL_BASELINE_PASSED -->

            **Revisión inicial visual/documental Playwright superada.** Las pruebas específicas del baseline pasaron y sus evidencias se subieron correctamente: directorio escritorio/móvil (skeletons, vacío y error), plantilla HTML de email renderizada y PDF generado con datos ficticios adjunto. [Evidencias de la ejecución](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). No se repite en semanas posteriores salvo fallo o cambio relevante.
        run: |
          payload="$(python3 -c 'import json,os; print(json.dumps({"body": os.environ["BODY"]}))')"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/4/comments" \
            -d "$payload"

      - name: Run complete Playwright suite
        id: tests
        if: always() && steps.install.outcome == 'success' && steps.chromium.outcome == 'success' && (github.event_name != 'schedule' || steps.schedule.outputs.run_e2e == 'true')
        working-directory: e2e
        env:
          E2E_RUN_VISUAL_BASELINE: 'false'
        run: npx playwright test

      - name: Upload Playwright report and traces
        if: always() && (github.event_name != 'schedule' || steps.schedule.outputs.run_e2e == 'true')
        uses: actions/upload-artifact@v6
        with:
          name: playwright-e2e-results
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

