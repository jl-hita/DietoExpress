name: Playwright E2E semanal

on:
  # GitHub Actions usa UTC. Las dos horas cubren las 02:00 locales de
  # Europe/Madrid tanto en horario de invierno como de verano; un paso
  # inicial deja continuar solo a la ejecución que corresponda.
  schedule:
    - cron: '0 0 * * 0'
    - cron: '0 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dietoexpress-playwright-e2e
  cancel-in-progress: false

jobs:
  browser-tests:
    name: Batería E2E completa (semanal)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://jlhitap.duckdns.org' }}
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

    steps:
      - name: Seleccionar ejecución de las 02:00 de Madrid
        id: schedule
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          local_hour="$(TZ=Europe/Madrid date +%H)"
          if [[ "$local_hour" == "02" ]]; then
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            echo "Se ejecuta la batería semanal a las 02:00 de Europe/Madrid."
          else
            echo "run_e2e=false" >> "$GITHUB_OUTPUT"
            echo "Esta invocación UTC no corresponde a las 02:00 locales; no se ejecutarán pruebas."
          fi

      - name: Checkout
        if: github.event_name != 'schedule' || steps.schedule.outputs.run_e2e == 'true'
        uses: actions/checkout@v7

      - name: Setup Node
        if: github.event_name != 'schedule' || steps.schedule.outputs.run_e2e == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: e2e/package.json

      - name: Install Playwright test runner
        if: github.event_name != 'schedule' || steps.schedule.outputs.run_e2e == 'true'
        working-directory: e2e
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install Chromium
        if: github.event_name != 'schedule' || steps.schedule.outputs.run_e2e == 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Allow production deployment to finish
        if: github.event_name == 'workflow_dispatch'
        run: sleep 240

      - name: Run complete Playwright suite
        if: github.event_name != 'schedule' || steps.schedule.outputs.run_e2e == 'true'
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report and traces
        if: always() && (github.event_name != 'schedule' || steps.schedule.outputs.run_e2e == 'true')
        uses: actions/upload-artifact@v6
        with:
          name: playwright-e2e-results
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
