name: Playwright E2E semanal

on:
  # GitHub Actions programa en UTC. Estas dos invocaciones cubren las 02:00
  # de Europe/Madrid en invierno y verano; el primer paso filtra la correcta.
  schedule:
    - cron: '0 0 * * 0'
    - cron: '0 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: dietoexpress-playwright-e2e
  cancel-in-progress: false

jobs:
  browser-tests:
    name: Batería E2E completa (semanal)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://jlhitap.duckdns.org' }}
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_SUPERADMIN_USERNAME: ${{ secrets.E2E_SUPERADMIN_USERNAME }}
      E2E_SUPERADMIN_PASSWORD: ${{ secrets.E2E_SUPERADMIN_PASSWORD }}

    steps:
      - name: Seleccionar ejecución de las 02:00 de Madrid
        id: schedule
        if: github.event_name == 'schedule'
        shell: bash
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          # Se usa la expresión que disparó el workflow, no la hora de inicio
          # del runner, porque GitHub puede retrasar una ejecución programada.
          local_offset="$(TZ=Europe/Madrid date +%z)"
          if [[ "$local_offset" == "+0200" && "$SCHEDULE_CRON" == "0 0 * * 0" ]] ||
             [[ "$local_offset" == "+0100" && "$SCHEDULE_CRON" == "0 1 * * 0" ]]; then
            echo "run_e2e=true" >> "$GITHUB_OUTPUT"
            echo "Esta invocación corresponde a las 02:00 de Europe/Madrid."
          else
            echo "run_e2e=false" >> "$GITHUB_OUTPUT"
            echo "Esta invocación UTC no corresponde a las 02:00 locales; no se ejecutarán pruebas."
          fi

      - name: Detectar si sigue pendiente la revisión visual inicial
        id: baseline
        if: github.event_name != 'schedule' || steps.schedule.outputs.run_e2e == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          comments="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/4/comments?per_page=100")"
          if printf '%s' "$comments" | python3 -c 'import json,sys; data=json.load(sys.stdin); marker="<!-- E2E_VISUAL_BASELINE_PASSED -->"; sys.exit(0 if any(marker in (item.get("body") or "") for item in data) else 1)'; then
            echo "run_visual_baseline=false" >> "$GITHUB_OUTPUT"
            echo "La revisión visual/documental inicial ya pasó; no se repite."
          else
            echo "run_visual_baseline=true" >> "$GITHUB_OUTPUT"
            echo "Se ejecutará la revisión visual/documental inicial."
          fi

      - name: Checkout
        if: github.event_name != 'schedule' || steps.schedule.outputs.run_e2e == 'true'
        uses: actions/checkout@v7

      - name: Setup Node
        if: github.event_name != 'schedule' || steps.schedule.outputs.run_e2e == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3

      - name: Install Playwright test runner
        if: github.event_name != 'schedule' || steps.schedule.outputs.run_e2e == 'true'
        working-directory: e2e
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Install Chromium
        if: github.event_name != 'schedule' || steps.schedule.outputs.run_e2e == 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run complete Playwright suite
        id: tests
        if: github.event_name != 'schedule' || steps.schedule.outputs.run_e2e == 'true'
        working-directory: e2e
        env:
          E2E_RUN_VISUAL_BASELINE: ${{ steps.baseline.outputs.run_visual_baseline }}
        run: npx playwright test

      - name: Upload Playwright report and traces
        if: always() && (github.event_name != 'schedule' || steps.schedule.outputs.run_e2e == 'true')
        uses: actions/upload-artifact@v6
        with:
          name: playwright-e2e-results
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Registrar revisión visual/documental completada
        if: success() && steps.baseline.outputs.run_visual_baseline == 'true' && (github.event_name != 'schedule' || steps.schedule.outputs.run_e2e == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: |
            <!-- E2E_VISUAL_BASELINE_PASSED -->

            **Revisión inicial visual/documental Playwright superada.** Directorio escritorio/móvil (skeletons, vacío y error) y contrato de marca/UTF-8 de PDFs y emails verificados. Evidencias y capturas: [ejecución Playwright](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Esta batería inicial no se repite en semanas posteriores salvo fallo o cambio relevante.
        run: |
          payload="$(python3 -c 'import json,os; print(json.dumps({"body": os.environ["BODY"]}))')"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/issues/4/comments" \
            -d "$payload"

