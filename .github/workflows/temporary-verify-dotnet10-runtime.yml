name: Temporary .NET 10 runtime verification

on:
  push:
    branches:
      - ops/verify-dotnet10-runtime

jobs:
  verify-runtime:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Verify installed runtimes
        shell: bash
        run: |
          set -euo pipefail
          echo "Runner: $(hostname)"
          /usr/bin/dotnet --list-runtimes
          /usr/bin/dotnet --list-runtimes | grep -E '^Microsoft\.AspNetCore\.App 10\.'
          /usr/bin/dotnet --list-runtimes | grep -E '^Microsoft\.NETCore\.App 10\.'
