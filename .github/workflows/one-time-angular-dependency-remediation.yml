name: One-time Angular dependency remediation

on:
  push:
    branches:
      - refactor/angular22-all-components

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm
          cache-dependency-path: anguloso.client/package-lock.json

      - name: Install Vitest and DOM environment
        working-directory: anguloso.client
        run: npm install --save-dev vitest jsdom

      - name: Remove Karma and Jasmine dependencies
        working-directory: anguloso.client
        run: npm uninstall @types/jasmine jasmine-core karma karma-chrome-launcher karma-coverage karma-jasmine karma-jasmine-html-reporter

      - name: Switch Angular test builder to Vitest
        working-directory: anguloso.client
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const angularPath = 'angular.json';
          const angular = JSON.parse(fs.readFileSync(angularPath, 'utf8'));
          const project = angular.projects['anguloso.client'];
          project.architect.test = {
            builder: '@angular/build:unit-test',
            options: {
              tsConfig: 'tsconfig.spec.json',
              buildTarget: 'anguloso.client:build:development'
            }
          };
          fs.writeFileSync(angularPath, JSON.stringify(angular, null, 2) + '\n');

          const tsPath = 'tsconfig.spec.json';
          let ts = fs.readFileSync(tsPath, 'utf8');
          ts = ts.replace(/"types"\s*:\s*\[[^\]]*\]/, '"types": ["vitest/globals"]');
          fs.writeFileSync(tsPath, ts);
          NODE

      - name: Refactor Jasmine specs to Vitest
        working-directory: anguloso.client
        run: npx ng g @schematics/angular:refactor-jasmine-vitest --project=anguloso.client --add-imports --verbose

      - name: Remove obsolete Karma configuration
        run: rm -f anguloso.client/karma.conf.js anguloso.client/src/test.ts

      - name: Run full frontend test suite
        working-directory: anguloso.client
        run: npm test -- --watch=false

      - name: Build Angular production bundle
        working-directory: anguloso.client
        run: npm run build

      - name: Require zero high/critical frontend vulnerabilities
        working-directory: anguloso.client
        run: npm audit --audit-level=high

      - name: Commit validated remediation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anguloso.client/package.json anguloso.client/package-lock.json anguloso.client/angular.json anguloso.client/tsconfig.spec.json anguloso.client/src anguloso.client/karma.conf.js
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 1
          fi
          git commit -m "fix: migrate Angular tests to Vitest and remediate dev vulnerabilities"
          git push origin "HEAD:${GITHUB_REF_NAME}"
