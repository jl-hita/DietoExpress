name: Temporary Angular lockfile generation

on:
  push:
    branches:
      - migration/angular22

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v7
        with:
          ref: migration/angular22
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
      - name: Regenerate package-lock without lifecycle scripts
        working-directory: anguloso.client
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit updated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anguloso.client/package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock.json is already up to date"
            exit 0
          fi
          git commit -m "build: regenerate lockfile for Angular 22"
          git push origin HEAD:migration/angular22
