name: Android validation

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-validation.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.1"

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
