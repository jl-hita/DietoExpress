name: PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Las validaciones de PR comparten una única cola.
# Si llega un commit más reciente antes de empezar/terminar la validación anterior,
# GitHub cancela la ejecución obsoleta y conserva únicamente la más reciente.
concurrency:
  group: dietoexpress-pr-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Shell script syntax
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Angular install
        working-directory: anguloso.client
        run: npm install

      - name: Angular dependency audit
        working-directory: anguloso.client
        run: npm audit --omit=dev --audit-level=high

      - name: Angular build
        working-directory: anguloso.client
        run: npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.x

      - name: .NET restore
        run: dotnet restore Anguloso.Server/Anguloso.Server.csproj

      - name: .NET dependency audit
        run: |
          set -o pipefail
          audit_output="$(dotnet list Anguloso.Server/Anguloso.Server.csproj package --vulnerable --include-transitive)"
          printf '%s\n' "$audit_output"
          if printf '%s\n' "$audit_output" | grep -Eiq '>.*(High|Critical)'; then
            echo "Se han detectado vulnerabilidades High/Critical en dependencias .NET."
            exit 1
          fi

      - name: .NET build
        run: dotnet build Anguloso.Server/Anguloso.Server.csproj -c Release --no-restore

      - name: Restore security tests
        run: dotnet restore Tests/DietoExpress.Security.Tests/DietoExpress.Security.Tests.csproj

      - name: Security tests
        run: dotnet test Tests/DietoExpress.Security.Tests/DietoExpress.Security.Tests.csproj -c Release --no-restore
