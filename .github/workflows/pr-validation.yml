name: PR Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

# Cada PR tiene su propio grupo: solo un commit nuevo del mismo PR cancela
# su validación anterior; los PR distintos pueden validarse en paralelo.
concurrency:
  group: dietoexpress-pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dietoexpress_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dietoexpress_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DIETOEXPRESS_IDEMPOTENCY_TEST_CONNECTION: Host=localhost;Port=5432;Database=dietoexpress_test;Username=postgres;Password=postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Shell script syntax
        run: |
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3

      # Solo comprobación sintáctica; no instala Playwright ni ejecuta pruebas de navegador.
      - name: Sintaxis de scripts E2E (sin ejecutar Playwright)
        run: find e2e -type f -name '*.mjs' -print0 | xargs -0 -r -n1 node --check

      - name: Angular install
        working-directory: anguloso.client
        # Angular tests use Vitest; Karma is only an unused optional peer of @angular/build.
        # Omitting peer packages avoids installing Karma's deprecated glob/rimraf/inflight chain.
        run: npm ci --omit=peer

      - name: Angular legacy dependency report
        working-directory: anguloso.client
        run: |
          npm ls inflight rimraf glob uuid --all || true

      - name: Angular full dependency audit report
        working-directory: anguloso.client
        run: |
          npm audit --json > npm-audit.json || true
          node <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          console.log('Vulnerabilities by severity:', JSON.stringify(audit.metadata?.vulnerabilities ?? {}, null, 2));
          for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
            console.log(JSON.stringify({
              name,
              severity: item.severity,
              direct: item.isDirect,
              range: item.range,
              fixAvailable: item.fixAvailable,
              via: item.via.map(v => typeof v === 'string' ? v : {
                title: v.title,
                url: v.url,
                range: v.range,
                severity: v.severity
              })
            }));
          }
          NODE
          npm audit --audit-level=high

      - name: Angular production dependency audit
        working-directory: anguloso.client
        run: npm audit --omit=dev --audit-level=high

      - name: Angular build
        working-directory: anguloso.client
        run: npm run build

      - name: Angular unit tests
        working-directory: anguloso.client
        run: npm test -- --watch=false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          # Pin a published SDK patch and skip the unnecessary runtime pre-pass.
          # The floating 10.x resolver returned an unavailable SDK/runtime (HTTP 409).
          dotnet-version: 10.0.401

      - name: .NET restore
        run: dotnet restore Anguloso.Server/Anguloso.Server.csproj

      - name: .NET dependency audit
        run: |
          set -o pipefail
          audit_output="$(dotnet list Anguloso.Server/Anguloso.Server.csproj package --vulnerable --include-transitive)"
          printf '%s\n' "$audit_output"
          if printf '%s\n' "$audit_output" | grep -Eiq '>.*(High|Critical)'; then
            echo "Se han detectado vulnerabilidades High/Critical en dependencias .NET."
            exit 1
          fi

      - name: .NET build
        run: dotnet build Anguloso.Server/Anguloso.Server.csproj -c Release --no-restore

      - name: Restore security tests
        run: dotnet restore Tests/DietoExpress.Security.Tests/DietoExpress.Security.Tests.csproj

      - name: Security test dependency audit
        run: |
          set -o pipefail
          audit_output="$(dotnet list Tests/DietoExpress.Security.Tests/DietoExpress.Security.Tests.csproj package --vulnerable --include-transitive)"
          printf '%s\n' "$audit_output"
          if printf '%s\n' "$audit_output" | grep -Eiq '>.*(High|Critical)'; then
            echo "Se han detectado vulnerabilidades High/Critical en dependencias del proyecto de tests."
            exit 1
          fi

      - name: Security tests and training generator evaluation
        env:
          TRAINING_GENERATOR_REPORT_PATH: ${{ github.workspace }}/artifacts/training-generator-evaluation.json
          TRAINING_GENERATOR_REAL_CATALOG_REPORT_PATH: ${{ github.workspace }}/artifacts/training-generator-real-catalog-evaluation.json
        run: dotnet test Tests/DietoExpress.Security.Tests/DietoExpress.Security.Tests.csproj -c Release --no-restore

      - name: Descargar export temporal del catálogo RepDB desplegado
        if: github.head_ref == 'audit/repdb-p1-quality-20261107'
        id: live_catalog_export
        continue-on-error: true
        run: |
          mkdir -p artifacts
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 --connect-timeout 15 --max-time 180 \
            'https://jlhitap.duckdns.org/api/exercise-catalog/audit-export' \
            --output artifacts/repdb-live-catalog-audit.json
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('artifacts/repdb-live-catalog-audit.json', 'utf8'));
          if (report.complete !== true || !Array.isArray(report.items) ||
              report.totalRecords !== report.returned || report.items.length !== report.totalRecords) {
            throw new Error('El endpoint no ha devuelto un export completo y verificable.');
          }
          const summary = {
            totalRecords: report.totalRecords,
            returned: report.returned,
            countsByStatus: report.countsByStatus ?? {},
            sourceCounts: report.items.reduce((counts, item) => {
              const source = item.source ?? 'unknown';
              counts[source] = (counts[source] ?? 0) + 1;
              return counts;
            }, {})
          };
          console.log(JSON.stringify(summary, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## Export real del catálogo RepDB desplegado\n\n' +
            '- Registros: **' + summary.totalRecords + '**\n' +
            '- Estados: `' + JSON.stringify(summary.countsByStatus) + '`\n' +
            '- Fuentes: `' + JSON.stringify(summary.sourceCounts) + '`\n');
          NODE

      - name: Publicar export temporal del catálogo RepDB desplegado
        if: github.head_ref == 'audit/repdb-p1-quality-20261107' && steps.live_catalog_export.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: repdb-live-catalog-audit
          path: artifacts/repdb-live-catalog-audit.json
          if-no-files-found: error
          retention-days: 1

      - name: Resumen de evaluación del generador
        if: always()
        env:
          REPORT_PATH: artifacts/training-generator-evaluation.json
        run: |
          if [ ! -f "$REPORT_PATH" ]; then
            echo "No se generó el informe JSON de evaluación." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8'));
          const lines = [
            '## Evaluación del generador de rutinas',
            '',
            `- Escenarios: **${report.scenarioCount}**`,
            `- Generaciones correctas: **${report.successfulScenarios}**`,
            `- Violaciones estructurales: **${report.hardViolationCount}**`,
            '',
            'El JSON completo incluye cada entrada, plan generado, métricas descriptivas y limitaciones.'
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE

      - name: Publicar JSON completo de evaluación
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: training-generator-evaluation
          path: |
            artifacts/training-generator-evaluation.json
            artifacts/training-generator-real-catalog-evaluation.json
          if-no-files-found: error
          retention-days: 14
