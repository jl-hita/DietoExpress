name: Generate npm lockfile (temporary)

on:
  push:
    branches:
      - chore/generate-npm-lockfile

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anguloso.client
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Generate lockfile
        run: npm install --package-lock-only
      - name: Verify clean installation
        run: npm ci
      - name: Verify Angular build
        run: npm run build
      - name: Commit generated lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f anguloso.client/package-lock.json
          git commit -m "build: generar lockfile npm reproducible"
          git push
