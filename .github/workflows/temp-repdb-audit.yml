name: Temporary RepDB catalog audit export

on:
  push:
    branches:
      - audit/repdb-catalog-export-20261107

jobs:
  export-catalog:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    steps:
      - name: Exportar catálogo RepDB desde la API local desplegada
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE"
          curl --fail --silent --show-error --retry 3 --retry-all-errors \
            --connect-timeout 5 --max-time 120 \
            -H "Accept: application/json" \
            "http://127.0.0.1:5000/api/exercise-catalog/audit-export" \
            -o "$GITHUB_WORKSPACE/repdb-catalog-audit.json"
          python3 - <<'PY'
          import json, os
          path = os.path.join(os.environ["GITHUB_WORKSPACE"], "repdb-catalog-audit.json")
          with open(path, encoding="utf-8") as f:
              data = json.load(f)
          items = data.get("items")
          if not isinstance(items, list) or data.get("complete") is not True:
              raise SystemExit("La exportación no está marcada como completa.")
          if data.get("returned") != len(items) or data.get("totalRecords") != len(items):
              raise SystemExit("Los contadores no coinciden con las filas exportadas.")
          if any(item.get("source") != "repdb-free" for item in items):
              raise SystemExit("La exportación contiene filas ajenas a RepDB.")
          print("Exportación completa: %d filas RepDB; estados=%s" %
                (len(items), data.get("countsByStatus", {})))
          PY
      - name: Subir exportación temporal para auditoría
        uses: actions/upload-artifact@v7
        with:
          name: repdb-catalog-audit-live
          path: ${{ github.workspace }}/repdb-catalog-audit.json
          if-no-files-found: error
          retention-days: 1
