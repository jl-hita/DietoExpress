name: Temporary .NET runtime preflight

on:
  push:
    branches:
      - ops/check-dotnet-runtime

permissions:
  contents: read

jobs:
  runtime:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Report installed .NET runtimes and SDKs
        run: |
          set -euo pipefail
          echo "=== /usr/bin/dotnet runtimes ==="
          /usr/bin/dotnet --list-runtimes
          echo "=== /usr/bin/dotnet SDKs ==="
          /usr/bin/dotnet --list-sdks
